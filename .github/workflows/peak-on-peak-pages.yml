name: Deploy Peak on Peak

on:
  push:
    branches: [main]
    paths: ["peak-on-peak/**", ".github/workflows/peak-on-peak-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: peak-on-peak
      - id: deployment
        uses: actions/deploy-pages@v4
