<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Peak on Peak</title>
<meta name="description" content="Peak on Peak training log: daily sessions, set and weight logging, rest timer and a full-year tracker.">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151C26" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Peak on Peak">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header><div class="wrap" id="hdr"></div></header>
<main><div class="wrap" id="app"></div></main>
<div class="timer" id="timer"><div class="wrap">
  <div class="t" id="tt">0:00</div><div class="lbl" id="tl">Rest</div>
  <button id="tplus">+15 s</button><button id="tskip">Done</button>
</div></div>
<div class="toast" id="toast" hidden><span id="toastmsg"></span><button id="toastbtn" hidden></button></div>
<input type="file" id="importfile" accept="application/json,.json" hidden>
<script src="app.js"></script>
</body>
</html>
